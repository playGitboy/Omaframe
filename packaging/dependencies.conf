# Omaframe 依赖清单（单一事实来源 / single source of truth）
#
# scripts/install.sh 与 packaging/PKGBUILD 都以本文件为准。
# 改动依赖后必须同步三处，并跑 `scripts/check-release.sh` 校验（pre-push 会跑）。
#
# 格式：  <类别> <pacman 包名> [说明]
# 类别：  runtime  运行必需，缺失程序无法启动
#        build    仅编译需要
#        optional 可选，缺失时对应功能降级（不致命）

# ---- 运行依赖（与 ldd 实际链接的库一一对应）----
runtime gtk4                 GTK4
runtime libadwaita            libadwaita (GTK4 组件库)
runtime gtk4-layer-shell      wlr-layer-shell 协议（layer surface）
runtime gdk-pixbuf2           图片解码
runtime cairo                 2D 绘制（九宫格/遮罩/托盘图标）
runtime pango                 文本排版
runtime glib2                 glib/gobject/gio
runtime libx11                GTK4 运行时依赖

# ---- 构建依赖（system-deps 需要对应的 .pc）----
build   pkgconf               提供 pkg-config
build   rust                  Rust 工具链（编译）
build   cargo                 Rust 构建
build   gtk4
build   libadwaita
build   gtk4-layer-shell
build   gdk-pixbuf2
build   cairo
build   pango
build   glib2
build   libx11

# ---- 可选：缺失时对应功能自动降级，程序仍可运行 ----
optional ffmpeg               视频解码（缺了只放图片；对应 video feature）
optional imagemagick          HEIC/HEIF 回退解码（缺了只少支持 HEIC 相框素材）