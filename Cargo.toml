[package]
name = "omaframe"
version = "0.6.1"
edition = "2021"
rust-version = "1.80"
description = "Omaframe — 智能自适应 PNG 相框：自动分析透明区域，按素材比例重构相框（Wayland / Hyprland / GTK4）"
license = "MIT"
repository = "https://github.com/playGitboy/Omaframe"
publish = false

[[bin]]
name = "omaframe"
path = "src/main.rs"

[dependencies]
# 显式声明最低 GTK/libadwaita 特性：不在 Cargo.toml 里开 v4_22 之类高版本特性，
# 这样在 GTK 4.10~4.22 的机器上都能编译（system-deps 只要求 >= 4.0.0）
gtk = { package = "gtk4", version = "0.11", default-features = false, features = ["v4_10"] }
gdk = { package = "gdk4", version = "0.11", default-features = false, features = ["v4_10"] }
glib = "0.22"
gio = "0.22"
gdk-pixbuf = "0.22"
cairo-rs = "0.22"
adw = { package = "libadwaita", version = "0.9", features = ["v1_4", "gtk_v4_10"] }
layer-shell = { package = "gtk4-layer-shell", version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
walkdir = "2"
rand = "0.9"

[features]
default = ["video", "hyprland"]
# 视频播放（需要系统 ffmpeg；缺失时自动降级为纯图片）
video = []
# 读取 Hyprland IPC 事件流实现"被覆盖则暂停"
hyprland = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
